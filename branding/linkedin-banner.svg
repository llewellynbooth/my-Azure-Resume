<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396"
     role="img" aria-label="Llewellyn Booth — Cloud &amp; Hybrid Infrastructure Engineer">
  <!--
    LinkedIn banner, 1584x396. Matches the site: dark ground, Azure-blue accent, Inter.
    To use: open this file in Chrome, screenshot at 1584x396 (or an SVG->PNG converter),
    upload the PNG as your LinkedIn background photo. Bottom-left is kept clear for the
    profile photo overlap.
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .name { font: 700 46px 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #f5f8fc; }
      .role { font: 600 24px 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #4cc2ff; letter-spacing: .2px; }
      .tag  { font: 400 16px 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #9aa7b4; letter-spacing: .3px; }
      .url  { font: 500 15px 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; fill: #4cc2ff; letter-spacing: .3px; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10243c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#0067c0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0067c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>

  <!-- faint diagonal line motif -->
  <g stroke="#4cc2ff" stroke-opacity="0.06" stroke-width="1.5">
    <line x1="-100" y1="120" x2="720" y2="-40"/>
    <line x1="-100" y1="230" x2="820" y2="10"/>
    <line x1="-100" y1="350" x2="920" y2="70"/>
    <line x1="-60"  y1="470" x2="1020" y2="130"/>
  </g>

  <!-- subtle 4-node cluster mark, right side -->
  <g transform="translate(1408,152)" stroke="#4cc2ff" stroke-opacity="0.5" fill="#4cc2ff" fill-opacity="0.5">
    <line x1="0"  y1="0"  x2="64" y2="0"  stroke-width="1.5"/>
    <line x1="0"  y1="0"  x2="0"  y2="64" stroke-width="1.5"/>
    <line x1="64" y1="0"  x2="64" y2="64" stroke-width="1.5"/>
    <line x1="0"  y1="64" x2="64" y2="64" stroke-width="1.5"/>
    <line x1="0"  y1="0"  x2="64" y2="64" stroke-width="1.5"/>
    <circle cx="0"  cy="0"  r="4.5"/>
    <circle cx="64" cy="0"  r="4.5"/>
    <circle cx="0"  cy="64" r="4.5"/>
    <circle cx="64" cy="64" r="4.5"/>
  </g>

  <!-- text block (right of the profile-photo overlap) -->
  <text class="name" x="610" y="176">Llewellyn Booth</text>
  <rect x="612" y="194" width="46" height="3" rx="1.5" fill="#4cc2ff"/>
  <text class="role" x="610" y="230">Cloud &amp; Hybrid Infrastructure Engineer</text>
  <text class="tag"  x="612" y="262">Microsoft Azure  ·  Azure Local / HCI  ·  Automation  ·  Perth, remote</text>
  <text class="url"  x="612" y="292">llewellynbooth.com</text>
</svg>

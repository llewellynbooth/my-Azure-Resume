name: deploy_backend
# Tests then deploys the Functions API when files under backend/ change.

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.main.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federated login to Azure
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/tests/tests.csproj
      - name: Test
        run: dotnet test backend/tests/tests.csproj --configuration Release --no-restore

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish backend/api/api.csproj --configuration Release --output ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Function App name
        id: fn
        run: |
          name=$(az functionapp list --resource-group azureresume-rg --query "[0].name" -o tsv)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $name"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.fn.outputs.name }}
          package: ./publish

      - name: Azure logout
        if: always()
        run: az logout

name: Lighthouse

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install -g @lhci/cli@0.14.x
      - name: Lighthouse CI
        run: lhci autorun

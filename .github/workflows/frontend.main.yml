name: deploy_frontend
# Deploys the static site when files under frontend/ change.

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.main.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federated login to Azure
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload site to $web
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --overwrite \
              --account-name resumestore100 \
              --auth-mode login \
              --destination '$web' \
              --source frontend/

      # NOTE: if "AzureResumeLlewellyn" is a Front Door profile (not classic CDN),
      # replace this with:  az afd endpoint purge --profile-name AzureResumeLlewellyn
      #   --endpoint-name <endpoint> --resource-group Azureresume-rg --domains "*"
      - name: Purge CDN
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az cdn endpoint purge \
              --content-paths "/*" \
              --resource-group Azureresume-rg \
              --profile-name AzureResumeLlewellyn \
              --name AzureResumeLlewellyn

      - name: Azure logout
        if: always()
        run: az logout
